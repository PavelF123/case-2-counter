<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Счётчик (Counter) — Кейс-задача № 2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="counter-card">
    <h1 class="title">Счётчик</h1>

    <div id="result" class="result-display" aria-live="polite">0</div>

    <div class="controls">
      <button id="minus-btn" type="button" class="btn">Минус (−)</button>
      <button id="plus-btn" type="button" class="btn">Плюс (+)</button>
    </div>

    <div id="extreme-message" class="extreme-window" aria-live="assertive"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
